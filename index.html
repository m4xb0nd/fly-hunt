<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/gif" href="/flies/normal-fly.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Охота на мух</title>
  </head>
  <body>
    <!-- Фильтр делает линии слегка неровными, как у карандашного рисунка. Используется в CSS через url(#sketch) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
